<!doctype html>
<html lang="zh-CN" data-edition="web"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1c2541"><meta name="description" content="课间：把大学生学习周计划变成看得见的日常，支持循环课表、具体行动、每日打卡与进度备份。">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><title>课间 · 学进去，再往前</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20192%20192%22%3E%3Crect%20width%3D%22192%22%20height%3D%22192%22%20rx%3D%2240%22%20fill%3D%22%231c2541%22/%3E%3Ccircle%20cx%3D%2296%22%20cy%3D%2296%22%20r%3D%2262%22%20fill%3D%22none%22%20stroke%3D%22%23d93a2b%22%20stroke-width%3D%2210%22/%3E%3Cpath%20d%3D%22M66%2098l20%2020%2042-46%22%20fill%3D%22none%22%20stroke%3D%22%23ffe14d%22%20stroke-width%3D%2216%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<style>:root {
  --paper: #f5efe0; --card: #fffcf3; --ink: #1c2541; --ink-2: #3d4766; --muted: #6b7290;
  --line: #1c2541; --grid: #dfe5ee; --red: #d93a2b; --red-soft: #fbe1dc;
  --hl: #ffe14d; --blue: #2f5bd3; --blue-soft: #dfe8ff; --mint: #9fe0bd; --pink: #ffb7c9;
  --shadow: 4px 4px 0 var(--ink); --shadow-sm: 2px 2px 0 var(--ink);
  --serif: 'Songti SC', 'STSong', 'Noto Serif CJK SC', 'Source Han Serif SC', 'SimSun', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { color-scheme: light; }
body { margin: 0; color: var(--ink); font: 14px/1.65 var(--sans); background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-attachment: fixed; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--serif); font-weight: 900; }
h1 { font-size: 30px; line-height: 1.35; letter-spacing: -.5px; }
h2 { font-size: 20px; line-height: 1.4; }
h3 { font-size: 16px; }
a { color: var(--blue); }
.icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
.sprite { width: 0; height: 0; position: absolute; }
.row { display: flex; align-items: center; gap: 9px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.muted { color: var(--muted); }
.eyebrow { font: 700 10px/1.6 var(--mono); letter-spacing: 1.5px; color: var(--red); text-transform: uppercase; }
.small { font-size: 11px; }
.hl { background: linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 92%, transparent 92%); padding: 0 2px; }

/* pills & buttons */
.pill { display: inline-flex; align-items: center; gap: 6px; font: 700 10px/1.7 var(--mono); padding: 3px 9px; border: 1.5px solid var(--ink); border-radius: 99px; background: var(--card); color: var(--ink); white-space: nowrap; }
.pill.blue { background: var(--blue-soft); }
.pill.mint { background: var(--mint); }
.pill.peach { background: var(--pink); }
.pill.lilac { background: #e3d7ff; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 17px; min-height: 44px; border: 2px solid var(--ink); border-radius: 10px; background: var(--hl); color: var(--ink); font-size: 13px; font-weight: 800; box-shadow: var(--shadow-sm); transition: transform .08s, box-shadow .08s; }
.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.btn .icon { width: 17px; height: 17px; }
.btn.light { background: var(--card); }
.btn.outline { background: transparent; box-shadow: none; border-style: dashed; }
.btn.outline:hover:not(:disabled) { box-shadow: none; transform: none; background: #fff8; }
.icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; background: var(--card); border: 2px solid var(--ink); border-radius: 10px; box-shadow: var(--shadow-sm); }
.icon-btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
.icon-btn .icon { width: 18px; height: 18px; }

/* cards */
.card { position: relative; padding: 24px; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
.card-head h2 { font-size: 19px; }
.progress-bar { height: 12px; background: var(--card); border: 2px solid var(--ink); border-radius: 99px; overflow: hidden; }
.progress-bar span { display: block; height: 100%; background: repeating-linear-gradient(-45deg, var(--red), var(--red) 6px, #e85a4b 6px, #e85a4b 12px); transition: width .3s; }

/* sidebar: exercise-book cover */
.sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 20; width: 212px; background: var(--ink); color: #c9cfe3; padding: 30px 18px; display: flex; flex-direction: column; overflow-y: auto; }
.sidebar:before { content: ''; position: absolute; top: 0; bottom: 0; right: 14px; width: 2px; background: var(--red); opacity: .8; }
.brand { display: flex; align-items: center; gap: 11px; }
.brand-mark { width: 40px; height: 40px; background: var(--red); color: #fff; border-radius: 8px; display: grid; place-items: center; transform: rotate(-6deg); border: 2px solid #fff; box-shadow: 2px 2px 0 #0006; }
.brand-mark .icon { width: 20px; height: 20px; }
.brand-title { font: 900 30px/1.2 var(--serif); letter-spacing: 2px; color: #fff; }
.brand-sub { color: var(--hl); font: 700 7px/1.5 var(--mono); letter-spacing: 1.5px; margin-top: 4px; }
.sidebar-caption { font: 12px/1.8 var(--serif); color: #a8b0cc; margin: 26px 2px 12px; padding: 8px 10px; border: 1.5px dashed #5a6488; border-radius: 8px; }
.navigation { display: flex; flex-direction: column; gap: 8px; counter-reset: navigation; }
.nav-button { min-height: 48px; width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; color: #d7dcee; padding: 10px 12px; font-size: 14px; font-weight: 700; border-radius: 10px; border: 2px solid transparent; position: relative; }
.nav-button:hover { border-color: #5a6488; }
.navigation .nav-button:before { counter-increment: navigation; content: '0' counter(navigation); font: 700 10px var(--mono); color: #7f89ad; }
.navigation .nav-button .icon { display: none; }
.nav-button.active { background: var(--hl); color: var(--ink); border-color: #fff; box-shadow: 3px 3px 0 #0008; }
.navigation .nav-button.active:before { color: var(--red); }
.navigation .nav-button.active:after { content: '✎'; margin-left: auto; font-size: 16px; }
.side-notebook { margin-top: auto; padding: 16px 14px; background: #fffcf3; color: var(--ink); border-radius: 4px; transform: rotate(-2deg); box-shadow: 3px 3px 0 #0007; position: relative; }
.side-notebook:before { content: ''; position: absolute; width: 54px; height: 16px; top: -8px; left: 50%; margin-left: -27px; background: #ffe14dcc; transform: rotate(3deg); }
.side-notebook .eyebrow { font-size: 8px; }
.side-notebook p { font: 13px/1.9 var(--serif); margin-top: 8px; }
.side-notebook span { display: block; font-size: 11px; line-height: 1.8; color: var(--red); margin-top: 8px; font-weight: 700; }
.side-bottom { margin-top: 22px; padding-top: 10px; border-top: 1.5px dashed #5a6488; }
.side-bottom .nav-button { font-size: 13px; min-height: 42px; }
.side-bottom .icon { width: 16px; height: 16px; }
.side-footer { font: 700 7px/1.8 var(--mono); letter-spacing: 1px; color: #7f89ad; margin-top: 12px; }

/* main & top */
main { margin-left: 212px; padding: 24px 38px 36px; max-width: 1640px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 18px; margin-bottom: 24px; border-bottom: 2px solid var(--ink); }
.breadcrumb { display: flex; gap: 9px; color: var(--muted); font: 12px var(--mono); }
.breadcrumb b { color: var(--ink); background: var(--hl); padding: 0 4px; }
.save-status { color: var(--ink-2); font-size: 11px; font-weight: 600; }
.save-dot { display: inline-block; height: 8px; width: 8px; background: #2bb673; border: 1.5px solid var(--ink); border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.save-status.error { color: var(--red); }
.quick-save { min-height: 40px; padding: 8px 13px; font-size: 12px; }
.avatar { display: none; }
.mobile-brand { display: none; }
.page-title { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 22px; }
.page-title h1 { margin-top: 4px; }
.page-title p { font-size: 13px; color: var(--ink-2); margin-top: 6px; }
.date-controls { display: flex; align-items: center; gap: 6px; }
.date-controls input, .week-navigation input { max-width: 150px; min-height: 40px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); padding: 7px 10px; font: 700 12px var(--mono); }
.date-controls .btn { min-height: 40px; padding: 8px 12px; font-size: 12px; }

/* hero: the notebook page */
.hero { position: relative; overflow: hidden; background: var(--card); border: 2px solid var(--ink); border-radius: 16px; box-shadow: 6px 6px 0 var(--ink); min-height: 300px; display: grid; grid-template-columns: 1.2fr 1fr; padding: 30px 36px 30px 64px; margin-bottom: 22px; }
.hero:before { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, transparent 44px, var(--red) 44px, var(--red) 46px, transparent 46px), repeating-linear-gradient(transparent 0 31px, #c9d6ea 31px 32px); opacity: .7; }
.hero:after { content: ''; position: absolute; left: 14px; top: 24px; bottom: 24px; width: 14px; background: radial-gradient(circle, var(--paper) 5px, var(--ink) 5.5px, var(--ink) 6.5px, transparent 7px) 0 0 / 14px 40px repeat-y; }
.hero-copy { position: relative; z-index: 2; }
.hero .eyebrow { margin-bottom: 14px; }
.hero h2 { font: 900 clamp(46px, 4.4vw, 70px)/1.15 var(--serif); letter-spacing: -1px; color: var(--ink); }
.hero h2 em { font-style: normal; color: var(--red); position: relative; }
.hero h2 em:after { content: ''; position: absolute; left: -2%; right: 6%; bottom: .02em; height: .2em; background: var(--hl); z-index: -1; transform: rotate(-1.5deg); border-radius: 4px; }
.hero-subline { font: 14px/1.9 var(--serif); color: var(--ink-2); margin-top: 14px; }
.hero-tags { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 20px; }
.hero-graphic { display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; }
.poster-disc { width: 230px; height: 230px; border: 2px dashed var(--blue); border-radius: 50%; position: absolute; top: 4px; right: 18px; opacity: .55; }
.poster-disc:before, .poster-disc:after { display: none; }
.poster-note { width: 180px; background: #fff7c2; color: var(--ink); border: 2px solid var(--ink); border-radius: 4px; padding: 14px 18px 13px; transform: rotate(-6deg); position: relative; margin-top: 8px; box-shadow: var(--shadow); }
.poster-note:before { content: ''; width: 60px; height: 20px; background: #9fd3ffcc; position: absolute; top: -10px; left: 58px; transform: rotate(6deg); border: 1px solid #0001; }
.poster-note .eyebrow { font-size: 8px; margin-bottom: 4px; }
.poster-number { font: 900 104px/.95 var(--mono); letter-spacing: -6px; color: var(--ink); border-bottom: 2px dashed var(--ink); padding: 8px 0 10px; }
.poster-note .poster-label { font: 700 10px/1.6 var(--mono); margin-top: 9px; color: var(--ink-2); }
.poster-sticker { position: absolute; bottom: 6px; right: 0; background: var(--blue); color: #fff; padding: 8px 14px; font: 800 12px/1.4 var(--mono); transform: rotate(5deg); border: 2px solid var(--ink); border-radius: 99px; box-shadow: var(--shadow-sm); }
.poster-star { position: absolute; top: 0; right: 4px; font-size: 56px; color: var(--red); line-height: 1; }
.hero-caption { position: absolute; right: 18px; top: 14px; font: 700 9px var(--mono); color: var(--muted); letter-spacing: 1px; }
.seal { position: absolute; z-index: 3; left: -6px; top: 12px; width: 92px; height: 92px; border: 4px double var(--red); border-radius: 50%; color: var(--red); display: grid; place-items: center; text-align: center; font: 900 20px/1.15 var(--serif); letter-spacing: 3px; transform: rotate(-16deg); background: #fffcf3cc; mix-blend-mode: multiply; animation: stamp .45s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stamp { from { transform: rotate(-16deg) scale(2.4); opacity: 0; } to { transform: rotate(-16deg) scale(1); opacity: .92; } }

/* week rail */
.week-rail { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; margin-bottom: 22px; }
.day-chip { min-height: 78px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 3px; justify-content: center; background: var(--card); border: 2px solid var(--ink); border-radius: 12px; color: var(--ink-2); font: 700 10px var(--mono); position: relative; transition: transform .1s; }
.day-chip:hover { transform: translateY(-2px); }
.day-chip b { font: 900 28px/1 var(--mono); color: var(--ink); letter-spacing: -1px; }
.day-chip.selected { background: var(--ink); color: var(--hl); box-shadow: 3px 3px 0 var(--red); }
.day-chip.selected b { color: #fff; }
.day-chip.today:not(.selected) { background: var(--hl); }
.day-chip.today:after { content: '今'; position: absolute; top: -9px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: #fff; font: 900 11px/22px var(--serif); border: 2px solid var(--ink); }
.chip-mark { width: 16px; height: 4px; background: #c5cad8; border-radius: 99px; margin-top: 3px; }
.chip-mark.complete { background: var(--red); }
.day-chip.selected .chip-mark:not(.complete) { background: #ffffff55; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { padding: 16px 18px; display: flex; align-items: center; gap: 12px; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; }
.stat:nth-child(1) { background: var(--blue-soft); }
.stat:nth-child(2) { background: #fff3b8; }
.stat:nth-child(3) { background: var(--red-soft); }
.stat-icon { color: var(--ink); background: var(--card); height: 40px; width: 40px; display: grid; place-items: center; border: 2px solid var(--ink); border-radius: 50%; }
.stat-value { font: 900 28px/1.1 var(--mono); color: var(--ink); letter-spacing: -1px; }
.stat-unit { font: 700 11px var(--mono); margin-left: 4px; color: var(--ink-2); letter-spacing: 0; }
.stat-label { font-size: 11px; color: var(--ink-2); margin-top: 5px; }

/* dashboard */
.dashboard { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(270px, 1fr); gap: 22px; align-items: start; }
.right-stack { display: flex; flex-direction: column; gap: 20px; }
.block-group-head { display: flex; gap: 8px; align-items: center; font: 900 15px var(--serif); margin: 8px 0 2px; }
.block-group-head:after { content: ''; height: 0; border-top: 2px dashed var(--ink); flex: 1; opacity: .35; }
.block-group-head span { color: var(--red); font-family: var(--mono); }
.block-group + .block-group { margin-top: 20px; }
.block { display: flex; align-items: flex-start; gap: 14px; padding: 18px 0; border-bottom: 1.5px solid #1c254122; }
.block:last-child { border: 0; }
.block-time { font: 800 17px/1.25 var(--mono); color: var(--ink); width: 66px; min-width: 66px; padding-top: 2px; letter-spacing: -.5px; }
.block-time small { display: block; font: 600 10px/1.5 var(--mono); color: var(--muted); margin-top: 5px; letter-spacing: 0; }
.block-body { flex: 1; min-width: 0; }
.block-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 11px; }
.block-name { display: flex; gap: 8px; flex: 1; min-width: 0; padding: 0; text-align: left; align-items: flex-start; }
.block-name b { font-size: 16px; font-weight: 800; }
.block-name .icon { width: 14px; height: 14px; color: var(--muted); margin-top: 5px; }
.course-dot { height: 14px; width: 14px; margin-top: 4px; flex-shrink: 0; border-radius: 4px; border: 2px solid var(--ink); }
.block-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.block-tags span { font-size: 10px; font-weight: 700; color: var(--ink-2); border: 1.5px solid #1c254155; background: var(--card); padding: 1px 7px; border-radius: 99px; }
.block-tags span.added { color: var(--blue); border-color: var(--blue); }
.block-tags span.done-tag { color: #fff !important; background: var(--red) !important; border-color: var(--red) !important; }
.block-summary { font-size: 13px; color: var(--ink-2); margin-top: 8px; line-height: 1.8; }
.task-toggle { display: grid; place-items: center; width: 40px; min-width: 40px; height: 40px; border: 2px solid var(--ink); border-radius: 10px; background: var(--card); color: #fff; box-shadow: var(--shadow-sm); transition: transform .1s; }
.task-toggle:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }
.task-toggle.complete { background: var(--red); border-color: var(--ink); animation: pop .3s ease; }
.task-toggle .icon { width: 22px; height: 22px; stroke-width: 3; }
@keyframes pop { 50% { transform: scale(1.18) rotate(-6deg); } }
.block.complete .block-name b { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: var(--muted); }
.block.complete .block-summary { color: var(--muted); }
.block-details { background: #fff7c2; border: 2px solid var(--ink); border-radius: 10px; padding: 12px 16px; margin-top: 14px; }
.block-details .muted { color: var(--ink-2); font-weight: 700; }
.step { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; }
.step + .step { border-top: 1.5px dashed #1c254155; }
.step-toggle { height: 30px; min-width: 30px; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--card); font: 800 11px var(--mono); margin-top: 1px; border-radius: 50%; }
.step-toggle.complete { background: var(--red); color: #fff; }
.step-toggle .icon { width: 16px; height: 16px; stroke-width: 3; }
.step b { font-size: 11px; color: var(--red); font-weight: 800; }
.step p { font-size: 13px; color: var(--ink); line-height: 1.9; margin-top: 3px; }
.block-edit { min-height: 36px; padding: 6px 0 0; display: flex; justify-content: flex-end; align-items: center; gap: 6px; width: 100%; color: var(--blue); font-size: 12px; font-weight: 700; }
.block-edit .icon { width: 14px; height: 14px; }
.task-rest { margin-top: 12px; background: #e9f8ef; border: 2px dashed #2bb673; border-radius: 10px; color: var(--ink-2); font-size: 12px; line-height: 1.9; padding: 10px 14px; }
.add-task { min-height: 46px; width: 100%; display: flex; gap: 7px; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; margin-top: 10px; color: var(--ink-2); border: 2px dashed #1c254166; border-radius: 12px; }
.add-task:hover { border-color: var(--ink); background: #fff8; }
.add-task .icon { width: 16px; height: 16px; }
.daily-note { padding-top: 18px; margin-top: 18px; border-top: 2px solid var(--ink); }
.daily-note label { display: block; font: 900 16px var(--serif); margin-bottom: 10px; }
.note-area { min-height: 110px; width: 100%; padding: 4px 14px; border: 2px solid var(--ink); border-radius: 10px; font-size: 14px; line-height: 32px; resize: vertical; color: var(--ink); background: #fffef9 repeating-linear-gradient(transparent 0 31px, #c9d6ea 31px 32px); background-attachment: local; }
.note-area::placeholder { color: #9aa0b8; }
.daily-confirm { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-top: 14px; }
.daily-confirm p { font-size: 12px; color: var(--ink-2); max-width: 52%; }
.daily-confirm .btn { min-width: 140px; background: var(--red); color: #fff; }
.daily-tips { padding-top: 14px; margin-top: 18px; font-size: 11px; line-height: 1.9; color: var(--muted); border-top: 1.5px dashed #1c254155; }

/* right column */
.progress-card { background: var(--ink); color: #fff; }
.progress-card .card-head h2 { color: #fff; }
.progress-card .pill { background: var(--hl); border-color: var(--hl); }
.progress-card { box-shadow: 4px 4px 0 var(--red); }
.ring-box { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.ring { width: 96px; height: 96px; transform: rotate(-90deg); flex-shrink: 0; }
.ring-background { fill: none; stroke: #ffffff26; stroke-width: 9; }
.ring-progress { fill: none; stroke: var(--hl); stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .4s; }
.ring-text { transform: rotate(90deg); transform-origin: 44px 44px; font: 900 18px var(--mono); fill: #fff; }
.ring-label { transform: rotate(90deg); transform-origin: 44px 44px; font: 700 5px var(--mono); fill: var(--hl); }
.focus-copy h3 { font-size: 21px; line-height: 1.45; color: #fff; }

<script>

const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)};
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>dateKey(new Date());
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return dateKey(d)};
const weekday=s=>(parse(s).getDay()+6)%7;
const monday=s=>add(s,-weekday(s));
const weekDates=s=>Array.from({length:7},(_,i)=>add(monday(s),i));
const validDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&s>='2000-01-01'&&s<='2100-12-31'&&dateKey(parse(s))===s;
const timeMinutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3));
const validTime=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
const formatMinutes=n=>n>=60?`${Math.floor(n/60)}h${n%60?String(n%60).padStart(2,'0'):''}`:`${n}min`;
const chineseDate=s=>`${Number(s.slice(5,7))}月${Number(s.slice(8))}日`;

let state=blank(),persistent=true,loadIssue=false;

let selected=today(),view='daily',month=selected.slice(0,7),expanded=new Set(),search='',courseFilter='',statusFilter='',toastTimer,noteTimer,editContext=null,previousFocus=null,autoExpandedDate=null;

function weekRecord(s){const w=monday(s);return state.weeks[w]||(state.weeks[w]={note:'',topics:{},reviews:{}})}
function tasks(s){const r=state.days[s];return [...PLAN.tasks.filter(t=>t.weekday===weekday(s)).map(t=>r?.overrides?.[t.id]||t),...(r?.extra||[])].sort((a,b)=>a.start.localeCompare(b.start))}
function taskById(s,id){return tasks(s).find(t=>t.id===id)}
function taskDone(s,t){return t.required&&s<=today()&&t.steps.every((_,i)=>state.days[s]?.checks?.[`${t.id}:${i}`]===true)}
function required(s){return tasks(s).filter(t=>t.required)}
function doneCount(s){return required(s).filter(t=>taskDone(s,t)).length}
function dayDone(s){return s<=today()&&state.days[s]?.checked===true&&doneCount(s)===required(s).length}
function weeklyTotal(s){return weekDates(s).reduce((n,d)=>n+required(d).length,0)}
function weeklyDone(s){return weekDates(s).reduce((n,d)=>n+doneCount(d),0)}
function studyMinutes(s){return tasks(s).filter(t=>t.category==='study').reduce((n,t)=>n+(t.minutes||0),0)}
function weekNumber(s){const a=parse(monday(s)),b=parse(state.settings.startWeek);return Math.round((Date.UTC(a.getFullYear(),a.getMonth(),a.getDate())-Date.UTC(b.getFullYear(),b.getMonth(),b.getDate()))/604800000)+1}
function cycle(s){const n=Math.max(0,weekNumber(s)-1);return PLAN.cycles[n%PLAN.cycles.length]}
function courseFor(name){return PLAN.courses.find(c=>c.name===name)}
function colorFor(t){const colors=['#ffe14d','#9fd3ff','#ffb7c9','#9fe0bd','#ffc98a','#d7c4ff','#a8e6e0'];const i=PLAN.courses.findIndex(c=>c.name===t.course);return i>=0?colors[i%colors.length]:({class:'#e4e7ef',work:'#f3dcc0',rest:'#c9f0d8',review:'#e3d7ff'}[t.category]||'#fff3b8')}
function topicFor(s,name){return state.weeks[monday(s)]?.topics?.[name]||(name==='大学生数学竞赛'?cycle(s).contest:name==='市场调研与分析大赛'?cycle(s).survey:name==='CET-6'?'短练习持续积累＋一个真题模块':'跟随本周真实授课章节，优先处理尚未独立掌握的内容')}
function saved(){const el=$('#save-status');el.classList.toggle('error',!persistent);el.innerHTML=persistent?'<i class="save-dot"></i>记录自动保存':'暂未持久保存 · 请备份'}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));persistent=true;saved();return true}catch(e){persistent=false;saved();toast('当前浏览器不能保存记录，请导出JSON备份。');return false}}
function flush(){clearTimeout(noteTimer);save()}
function toast(text){clearTimeout(toastTimer);$('#toast-root').innerHTML=`<div class="toast">${esc(text)}</div>`;toastTimer=setTimeout(()=>$('#toast-root').replaceChildren(),4000)}
function navigate(v){if(!NAV.some(n=>n[0]===v))return;flush();view=v;if(v==='calendar')month=selected.slice(0,7);render();window.scrollTo(0,0)}
function selectDate(s){if(!validDate(s)){toast('请选择2000—2100年的有效日期。');return}flush();selected=s;month=s.slice(0,7);expanded.clear();autoExpandedDate=null;view='daily';render();window.scrollTo(0,0)}
function nav(){document.querySelector('.navigation').innerHTML=NAV.slice(0,4).map(([v,i,title])=>`<button class="nav-button ${view===v?'active':''}" data-action="view" data-view="${v}" ${view===v?'aria-current="page"':''}>${icon(i)}${title}</button>`).join('');document.querySelector('.mobile-nav').innerHTML=NAV.map(([v,i,_,short])=>`<button data-action="view" data-view="${v}" class="${view===v?'active':''}" ${view===v?'aria-current="page"':''}>${icon(i)}${short}</button>`).join('');$('#breadcrumb').textContent=NAV.find(n=>n[0]===view)?.[2]||''}
function dateControls(){return `<div class="date-controls"><button class="icon-btn" data-action="prev-day" aria-label="前一天" ${selected==='2000-01-01'?'disabled':''}>${icon('left')}</button><input id="selected-date" type="date" value="${selected}" min="2000-01-01" max="2100-12-31" aria-label="选择日期"><button class="icon-btn" data-action="next-day" aria-label="后一天" ${selected==='2100-12-31'?'disabled':''}>${icon('right')}</button><button class="btn light" data-action="today">今天</button></div>`}
function illustration(){return `<div class="hero-graphic" aria-hidden="true"><div class="poster-disc"></div><div class="poster-note"><div class="eyebrow">DAILY FIELD NOTES</div><div class="poster-number">${selected.slice(8)}</div><div class="poster-label">${selected.slice(0,7).replace('-',' / ')}<br>周${'一二三四五六日'[weekday(selected)]} · ${required(selected).length} 项行动</div></div><span class="poster-star">✳</span><span class="poster-sticker">MAKE IT COUNT ↗</span>${dayDone(selected)?'<span class="seal">已<br>打卡</span>':''}</div>`}
function weekRail(){return `<div class="week-rail">${weekDates(selected).map((s,i)=>`<button class="day-chip ${s===selected?'selected':''} ${s===today()?'today':''}" data-action="select-date" data-date="${s}" aria-label="${s} 周${'一二三四五六日'[i]}${dayDone(s)?' 已打卡':''}" ${s===selected?'aria-current="date"':''}><span>周${'一二三四五六日'[i]}</span><b>${Number(s.slice(8))}</b><span class="chip-mark ${dayDone(s)?'complete':''}"></span></button>`).join('')}</div>`}
function taskHTML(t){const complete=taskDone(selected,t),open=expanded.has(t.id),future=selected>today(),r=state.days[selected];return `<article class="block ${complete?'complete':''}" data-task="${t.id}"><div class="block-time">${t.category==='rest'?'晚上':t.start}<small>${t.end?'— '+t.end:t.category==='rest'?'自由安排':'结束待确认'}</small></div><div class="block-body"><div class="block-header"><button class="block-name" data-action="expand" data-id="${t.id}" aria-expanded="${open}" aria-label="展开${esc(t.course)}任务做法"><span class="course-dot" style="background:${colorFor(t)}"></span><b>${esc(t.course)}</b>${icon(open?'down':'right')}</button>${t.required?`<button class="task-toggle ${complete?'complete':''}" data-action="toggle-task" data-id="${t.id}" aria-pressed="${complete}" aria-label="${complete?'取消完成':'完成'}${esc(t.course)} ${t.start}" ${future?'disabled':''}>${complete?icon('check'):''}</button>`:`<span class="pill peach">休息</span>`}</div><div class="block-tags"><span>${esc(t.kind)}</span>${t.minutes!==null?`<span>${t.minutes}分钟</span>`:''}${t.added?'<span class="added">补充短练</span>':''}${complete?'<span class="done-tag">已完成</span>':''}</div><p class="block-summary">${esc(t.title)}</p>${open?`<div class="block-details">${t.required&&courseFor(t.course)?`<div class="small muted" style="font-size:9px;margin-bottom:4px">本周重点 · ${esc(topicFor(selected,t.course))}</div>`:''}${t.steps.map((s,i)=>`<div class="step">${t.required?`<button class="step-toggle ${r?.checks?.[`${t.id}:${i}`]?'complete':''}" data-action="toggle-step" data-id="${t.id}" data-index="${i}" aria-pressed="${Boolean(r?.checks?.[`${t.id}:${i}`])}" aria-label="${esc(s.title)} ${esc(t.course)}" ${future?'disabled':''}>${r?.checks?.[`${t.id}:${i}`]?icon('check'):String(i+1).padStart(2,'0')}</button>`:icon('moon')}<div><b>${esc(s.title)}</b><p>${esc(s.detail)}</p></div></div>`).join('')}<button class="block-edit" data-action="edit-task" data-id="${t.id}">${icon('edit')}调整当天的做法${t.category==='study'?'与时间':''}</button></div>`:''}${!t.required&&!open?'<div class="task-rest">周六晚上不安排高强度学习，不计入必做任务。留白也是计划的一部分。</div>':''}</div></article>`}
function timeline(){const all=tasks(selected);const groups=[['上午','A GOOD START',all.filter(t=>t.start<'12:00')],['下午','KEEP A LITTLE MOMENTUM',all.filter(t=>t.start>='12:00'&&t.start<'18:00')],['晚上','SLOW DOWN, WRAP UP',all.filter(t=>t.start>='18:00')]];return groups.filter(g=>g[2].length).map(([title,en,items])=>`<section class="block-group"><div class="block-group-head">${title} <span style="font-size:7px;letter-spacing:1.2px">${en}</span></div>${items.map(taskHTML).join('')}</section>`).join('')}
function daily(){const n=doneCount(selected),total=required(selected).length,pct=Math.round(n/total*100),future=selected>today(),w=monday(selected),cy=cycle(selected),r=state.days[selected];if(autoExpandedDate!==selected){autoExpandedDate=selected;if(!expanded.size){const first=tasks(selected).find(t=>t.category==='study'&&!taskDone(selected,t));if(first)expanded.add(first.id)}}return `<section class="page-title daily-title"><div><div class="eyebrow">DAILY FIELD NOTES / ${selected.replaceAll('-','.')}</div><h1>${selected===today()?'今天的行动。':chineseDate(selected)+'的行动。'}</h1><p>拆小一步，独立尝试，再留下证据。</p></div></section><section class="hero"><div class="hero-copy"><div class="eyebrow">AFTERCLASS / THE STUDY EDITION</div><h2>学进去，<br><em>再往前。</em></h2><p class="hero-subline">把时间变成自己的理解。<br>今天的每一步，都有具体的做法。</p><div class="hero-tags"><span class="pill">${selected.replaceAll('-','.')} · 周${'一二三四五六日'[weekday(selected)]}</span><span class="pill">${weekNumber(selected)>0?'WEEK '+String(weekNumber(selected)).padStart(2,'0'):'历史周'}</span></div></div>${illustration()}<span class="hero-caption">SMALL STEPS. REAL PROGRESS.</span></section><div class="mobile-date-strip"><span class="mobile-date-label">DAY / ${'一二三四五六日'[weekday(selected)]}</span>${dateControls()}</div>${weekRail()}<div class="stats"><div class="stat"><div class="stat-icon">${icon('check')}</div><div><div class="stat-value">${n}<span class="stat-unit">/ ${total} 项</span></div><div class="stat-label">今天已完成${future?' · 可提前查看':''}</div></div></div><div class="stat"><div class="stat-icon">${icon('week')}</div><div><div class="stat-value">${weeklyDone(selected)}<span class="stat-unit">/ ${weeklyTotal(selected)} 项</span></div><div class="stat-label">所选周行动进度</div></div></div><div class="stat"><div class="stat-icon">${icon('clock')}</div><div><div class="stat-value">${formatMinutes(studyMinutes(selected))}</div><div class="stat-label">课外学习计划<br>不含上课时段</div></div></div></div><div class="dashboard"><section class="card timeline-card"><div class="card-head"><h2>今日时间线</h2><span class="pill blue">${dayDone(selected)?'今日已打卡':`${total}个行动 · ${total-n}项待完成`}</span></div>${future?'<div class="notice">未来任务可以查看、编辑和写笔记；到了当天再勾选打卡。</div>':''}${timeline()}<button class="add-task" data-action="add-task">${icon('plus')}添加当天的小任务</button><div class="daily-note"><label for="day-note">留下一点自己的尝试。</label><textarea class="note-area" id="day-note" maxlength="5000" placeholder="哪道题还没想通？今天留下了什么成果？记下题号、文件位置或下一步…">${esc(r?.note||'')}</textarea><div class="daily-confirm"><p>${future?'可以为未来做准备，打卡留到当天。':dayDone(selected)?'这一天已留下记录，休息也值得被认真安排。':n===total?'任务完成了，确认今天的真实成果吧。':'完成必做任务后再确认；休息不纳入完成率。'}</p><button class="btn" data-action="checkin" ${future||n!==total?'disabled':''}>${icon(dayDone(selected)?'check':'spark')}${dayDone(selected)?'已打卡 · 点击撤销':'确认今天的打卡'}</button></div></div><p class="daily-tips">19:00以后晚课的结束时间按实际课表确认；21:30整理若与课堂重叠，请在当天任务编辑中顺延，不要为打卡挤占上课、吃饭或睡眠。</p></section><div class="right-stack"><section class="card progress-card"><div class="card-head"><h2>今天的进度。</h2><span class="pill blue">${pct}%</span></div><div class="ring-box"><div class="focus-copy"><h3>${n===total?'今天的努力，收好了。':'把理解，留在今天。'}</h3><p>${n}/${total}个必做行动已完成<br>${dayDone(selected)?'今日打卡已确认':'任务完成后再确认每日打卡'}</p></div><svg class="ring" viewBox="0 0 88 88" aria-label="今日任务完成率${pct}%"><circle class="ring-background" cx="44" cy="44" r="36"/><circle class="ring-progress" cx="44" cy="44" r="36" stroke-dasharray="226.2" stroke-dashoffset="${226.2*(1-n/total)}"/><text class="ring-text" x="44" y="43" text-anchor="middle">${pct}%</text><text class="ring-label" x="44" y="54" text-anchor="middle">LITTLE PROGRESS</text></svg></div><div class="focus-quote">看懂答案只是开始。能独立走一遍，再留下自己的错因和条件，才是更扎实的进步。</div></section><section class="card"><div class="eyebrow">THIS WEEK'S SMALL CHAPTER</div><h3 class="week-focus-title">${esc(cy.title)}</h3><div class="focus-item">${icon('book')}<div><b>数学竞赛 · 专题建议</b><p>${esc(topicFor(selected,'大学生数学竞赛'))}</p></div></div><div class="focus-item">${icon('goal')}<div><b>市调项目 · 本周留下一份作品</b><p>${esc(topicFor(selected,'市场调研与分析大赛'))}</p></div></div><button class="text-link" data-action="view" data-view="goals">查看各科学习目标 ${icon('arrow')}</button></section><div class="protected-rest"><span class="rest-star">✳</span><h3>留白，不是落后。</h3><p>午餐、通勤和课间留一点缓冲。周六晚上属于你，不增加高强度学习任务。</p></div></div></div>`}
function weekly(){const ds=weekDates(selected),cy=cycle(selected),done=weeklyDone(selected),total=weeklyTotal(selected);return `<section class="page-title"><div><div class="eyebrow">ZOOM OUT. MAKE SPACE.</div><h1>把一周，看得明明白白。</h1><p>固定安排保持稳定，课外学习围绕一个清晰的小目标。</p></div><div class="week-navigation"><button class="icon-btn" data-action="prev-week" aria-label="上一周">${icon('left')}</button><input id="week-date" type="date" value="${monday(selected)}" min="2000-01-01" max="2100-12-31" aria-label="选择某一周"><button class="icon-btn" data-action="next-week" aria-label="下一周">${icon('right')}</button><button class="btn light" data-action="this-week">本周</button></div></section><section class="week-summary"><div class="row between"><span class="eyebrow">${ds[0].replaceAll('-','.')} — ${ds[6].replaceAll('-','.')}</span><span class="pill blue">${done}/${total} 项</span></div><h2>${esc(cy.title)}</h2><p>${esc(cy.output)} · 专项建议按六周滚动，可自行调整。</p><div class="week-actions"><span class="pill blue">数学与技能自学 ${formatMinutes(ds.reduce((n,d)=>n+studyMinutes(d),0))}</span><span class="pill mint">${ds.filter(dayDone).length}/7 天已确认打卡</span><span class="pill peach">周六晚 · 保留休息</span></div><div class="progress-bar" style="margin-top:19px"><span style="width:${done/total*100}%"></span></div></section><div class="week-table">${ds.map((d,i)=>`<section class="week-column"><div class="week-column-head"><b>周${'一二三四五六日'[i]} · ${Number(d.slice(8))}</b><span>${doneCount(d)}/${required(d).length}</span></div><div class="week-column-tasks">${tasks(d).map(t=>`<button class="week-mini-task ${taskDone(d,t)?'complete':''}" style="background:${colorFor(t)}" data-action="select-date" data-date="${d}" aria-label="查看${d} ${esc(t.course)}"><span>${t.category==='rest'?'晚上':t.start}${t.end?'—'+t.end:''} · ${esc(t.kind)}</span><b>${esc(t.course)}</b></button>`).join('')}</div></section>`).join('')}</div><section class="card week-note"><label for="week-note">这一周，值得留住什么？</label><textarea class="note-area" id="week-note" maxlength="5000" placeholder="写3个有效做法、一个仍没解决的卡点，以及下周最重要的一步…">${esc(state.weeks[monday(selected)]?.note||'')}</textarea><p class="small muted" style="margin-top:8px;font-size:10px">输入后自动保存；每周记录分别存储，切换周次不会覆盖。</p></section>`}
function goals(){const w=state.weeks[monday(selected)];return `<section class="page-title"><div><div class="eyebrow">UNDERSTAND IT. MAKE SOMETHING.</div><h1>这周学什么，做到什么程度。</h1><p>${chineseDate(monday(selected))}—${chineseDate(add(monday(selected),6))} · 每科有具体产出，实际章节由你填写。</p></div><button class="btn light" data-action="view" data-view="weekly">${icon('week')}选择周次</button></section><div class="goal-grid">${PLAN.courses.map(c=>{const items=weekDates(selected).flatMap(d=>tasks(d).filter(t=>t.category==='study'&&t.course===c.name).map(t=>({d,t}))),done=items.filter(({d,t})=>taskDone(d,t)).length,min=items.reduce((n,{t})=>n+(t.minutes||0),0);return `<section class="goal-card" style="--course-color:${colorFor({course:c.name})}"><div class="row between"><h3>${esc(c.name)}</h3><span class="pill blue">${done}/${items.length} 次</span></div><span class="goal-tag">${esc(c.tag)}</span><div class="goal-time">${formatMinutes(min)}<span>计划课外用时</span></div><div class="progress-bar"><span style="width:${done/items.length*100}%"></span></div><p><b style="font-weight:550">本周要留下 · </b>${esc(c.output)}</p><button class="goal-focus" data-action="edit-topic" data-course="${esc(c.name)}" aria-label="修改${esc(c.name)}本周重点"><span>${esc(topicFor(selected,c.name))}</span>${icon('edit')}</button></section>`}).join('')}</div><p class="goals-note">这里的用时只统计课外学习，上课、上班和休息另计。具体题量按章节和难度调整；数值分析新增3次30分钟短练，英语新增5次10分钟微练，概率论预习与周五练习各缩短30分钟。</p><section class="card review-section"><div class="card-head"><h2>本周复盘清单</h2><span class="pill mint">${Object.values(w?.reviews||{}).filter(Boolean).length}/${PLAN.reviews.length}</span></div>${PLAN.reviews.map((text,i)=>`<div class="review-row ${w?.reviews?.[i]?'done':''}"><button class="task-toggle ${w?.reviews?.[i]?'complete':''}" data-action="review-toggle" data-index="${i}" aria-pressed="${Boolean(w?.reviews?.[i])}" aria-label="复盘：${esc(text)}">${w?.reviews?.[i]?icon('check'):''}</button><span>${esc(text)}</span></div>`).join('')}<p class="small muted" style="font-size:10px;margin-top:14px">复盘勾选独立保存，不会自动把每日任务变成已完成。</p></section>`}
function calendarCells(){const [y,m]=month.split('-').map(Number),offset=(new Date(y,m-1,1,12).getDay()+6)%7,last=new Date(y,m,0,12).getDate();let matches=0;const cells=Array.from({length:offset},()=>'<div class="calendar-day empty"></div>');for(let day=1;day<=last;day++){const s=`${month}-${String(day).padStart(2,'0')}`,all=tasks(s);const yes=(!courseFilter||all.some(t=>t.course===courseFilter))&&(!search||all.some(t=>(t.course+t.title+t.steps.map(x=>x.detail).join('')).toLowerCase().includes(search.toLowerCase())))&&(!statusFilter||(statusFilter==='done'?dayDone(s):statusFilter==='todo'?!dayDone(s):s<today()&&!dayDone(s)));if(yes)matches++;cells.push(yes?`<button class="calendar-day ${s===today()?'today':''} ${s===selected?'selected':''} ${dayDone(s)?'done':''}" data-action="select-date" data-date="${s}" aria-label="${s} ${required(s).length}项任务${dayDone(s)?' 已打卡':''}"><b>${day}</b><span>${required(s).length}项行动<br>自学${formatMinutes(studyMinutes(s))}</span><small>${dayDone(s)?'✓ 已打卡':s>today()?'提前查看':doneCount(s)?doneCount(s)+'项完成':''}</small></button>`:`<div class="calendar-day empty"><b>${day}</b></div>`)}return ['一','二','三','四','五','六','日'].map(s=>`<div class="calendar-label">周${s}</div>`).join('')+cells.join('')+(!matches?'<p class="calendar-noresults">这个月没有匹配的日期，试试其他筛选条件。</p>':'')}
function calendar(){return `<section class="page-title"><div><div class="eyebrow">A CALENDAR OF LITTLE EFFORTS</div><h1>努力，慢慢有了形状。</h1><p>日期自动对应循环课表；每次打卡只记录在当天，未来日期不能提前完成。</p></div></section><div class="calendar-toolbar"><input id="calendar-search" class="search" type="search" value="${esc(search)}" placeholder="搜索课程、任务或做法…" aria-label="搜索任务"><select id="course-filter" aria-label="筛选课程"><option value="">全部课程</option>${PLAN.courses.map(c=>`<option value="${esc(c.name)}" ${courseFilter===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="status-filter" aria-label="筛选状态"><option value="">全部状态</option><option value="done" ${statusFilter==='done'?'selected':''}>已打卡</option><option value="todo" ${statusFilter==='todo'?'selected':''}>未打卡</option><option value="past" ${statusFilter==='past'?'selected':''}>过去未打卡</option></select></div><section class="card"><div class="card-head"><div class="row"><button class="icon-btn" data-action="prev-month" aria-label="上个月">${icon('left')}</button><h2 class="calendar-title">${month.slice(0,4)}年 ${Number(month.slice(5))}月</h2><button class="icon-btn" data-action="next-month" aria-label="下个月">${icon('right')}</button></div><button class="btn light" data-action="calendar-today">本月</button></div><div class="calendar-grid" id="calendar-grid">${calendarCells()}</div><div class="calendar-legend"><span><i class="legend-dot today"></i>今天</span><span><i class="legend-dot done"></i>已打卡</span><span><i class="legend-dot"></i>所选日期</span><span>搜索与筛选仅作用于当前月份</span></div></section>`}

function zipStore(files){

function csv(){flush();const head=['日期','星期','时间','课程/任务','类型','任务主题','步骤','具体做法','预计任务分钟','步骤状态','任务完成','当日打卡','今日笔记','周复盘'];const rows=weekDates(selected).flatMap(s=>tasks(s).flatMap(t=>t.steps.map((st,i)=>[s,'周'+'一二三四五六日'[weekday(s)],t.time,t.course,t.kind,t.title,st.title,st.detail,t.minutes??'时长待确认',t.required?(state.days[s]?.checks?.[`${t.id}:${i}`]?'已完成':'未完成'):'不纳入打卡',t.required?(taskDone(s,t)?'已完成':'未完成'):'休息',dayDone(s)?'已打卡':'未打卡',state.days[s]?.note||'',state.weeks[monday(s)]?.note||''])));const quote=v=>{let s=String(v);if(/^[\s]*[=+@-]|^[\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'};download('\ufeff'+[head,...rows].map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8',`课间_一周行动_${monday(selected)}.csv`);toast('已请求下载本周CSV，可用Excel打开。')}
function cleanTask(value,base,extra=false){if(!value||typeof value!=='object')throw Error('任务格式');if(typeof value.title!=='string'||!value.title.trim()||value.title.length>100||!Array.isArray(value.steps)||value.steps.length!==2||!validTime(value.start))throw Error('任务内容');const end=value.end;if(end!==null&&!validTime(end))throw Error('结束时间');if(end!==null&&timeMinutes(end)<=timeMinutes(value.start))throw Error('任务时间');const steps=value.steps.map(s=>{if(!s||typeof s.title!=='string'||s.title.length>80||typeof s.detail!=='string'||!s.detail.trim()||s.detail.length>3000)throw Error('步骤');return {title:s.title,detail:s.detail}});if(!extra&&['class','work','rest'].includes(base.category)&&(value.start!==base.start||value.end!==base.end))throw Error('固定时段');return {...base,title:value.title,start:value.start,end,time:!extra&&['class','work','rest'].includes(base.category)?base.time:`${value.start}${end?'—'+end:''}`,minutes:end===null?null:timeMinutes(end)-timeMinutes(value.start),steps};}
function validateBackup(value){if(!value||value.app!=='kejian-study'||value.version!==1||!value.days||typeof value.days!=='object'||Array.isArray(value.days)||Object.keys(value.days).length>6000)throw Error('不匹配的备份');const clean=blank();if(value.settings?.startWeek&&validDate(value.settings.startWeek))clean.settings.startWeek=monday(value.settings.startWeek);for(const [s,r] of Object.entries(value.days)){if(!validDate(s)||!r||typeof r!=='object'||Array.isArray(r))throw Error('日期记录');const out={checks:{},checked:r.checked===true&&s<=today(),note:typeof r.note==='string'?r.note.slice(0,5000):'',overrides:{},extra:[],checkedAt:typeof r.checkedAt==='string'?r.checkedAt:null};const originals=PLAN.tasks.filter(t=>t.weekday===weekday(s));if(r.overrides&&typeof r.overrides==='object')for(const [id,t]of Object.entries(r.overrides)){const base=originals.find(t=>t.id===id);if(!base)throw Error('未知任务');out.overrides[id]=cleanTask(t,base)}if(r.extra!==undefined){if(!Array.isArray(r.extra)||r.extra.length>20)throw Error('自定义任务过多');const ids=new Set();out.extra=r.extra.map(t=>{if(!t||typeof t.id!=='string'||!/^custom-[0-9a-z-]{1,50}$/.test(t.id)||ids.has(t.id))throw Error('自定义编号');ids.add(t.id);return cleanTask(t,{id:t.id,weekday:weekday(s),course:'自主任务',kind:'自定义',category:'study',required:true,added:true,original:'',originalTime:''},true)})}const all=[...originals.map(t=>out.overrides[t.id]||t),...out.extra];if(r.checks&&typeof r.checks==='object')for(const t of all)for(let i=0;i<t.steps.length;i++){const key=`${t.id}:${i}`;if(r.checks[key]===true&&t.required&&s<=today())out.checks[key]=true}clean.days[s]=out;}if(value.weeks&&typeof value.weeks==='object'&&!Array.isArray(value.weeks))for(const [s,w]of Object.entries(value.weeks)){if(!validDate(s)||monday(s)!==s||!w||typeof w!=='object')throw Error('周记录');const out={note:typeof w.note==='string'?w.note.slice(0,5000):'',topics:{},reviews:{}};for(const c of PLAN.courses)if(typeof w.topics?.[c.name]==='string')out.topics[c.name]=w.topics[c.name].slice(0,2000);for(let i=0;i<PLAN.reviews.length;i++)if(w.reviews?.[i]===true)out.reviews[i]=true;clean.weeks[s]=out}clean.lastBackup=typeof value.lastBackup==='string'?value.lastBackup.slice(0,100):null;return clean}
function showModal(html){previousFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-label="编辑或确认">${html}</section></div>`;document.body.style.overflow='hidden';$('#modal-root').querySelector('input,textarea,button')?.focus()}
function closeModal(){if(!$('#modal-root').firstChild)return;$('#modal-root').replaceChildren();document.body.style.overflow='';editContext=null;if(previousFocus?.isConnected)previousFocus.focus()}
function editTask(id,extra=false){if(extra&&(state.days[selected]?.extra||[]).length>=20){toast('一天最多补充20个任务，给休息留一点空白。');return}const t=extra?{id:'custom-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),weekday:weekday(selected),course:'自主任务',kind:'自定义',category:'study',required:true,added:true,title:'',start:'12:00',end:'12:30',steps:[{title:'具体怎么做',detail:''},{title:'完成到什么程度',detail:''}]}:taskById(selected,id),fixed=['class','work','rest'].includes(t.category);editContext={date:selected,t,extra};showModal(`<div class="modal-head"><h2>${extra?'加一个小任务':'让这一步更适合今天'}</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('close')}</button></div><form id="task-form"><label for="task-title">任务主题</label><input id="task-title" maxlength="100" required value="${esc(t.title)}"><div class="row"><div><label for="task-start">开始时间${fixed?'（固定）':''}</label><input id="task-start" type="time" required value="${t.start}" ${fixed?'disabled':''}></div><div><label for="task-end">结束时间${fixed?'（固定）':''}</label><input id="task-end" type="time" ${!fixed?'required':''} value="${t.end||''}" ${fixed?'disabled':''}></div></div><label for="task-method">具体怎么做</label><textarea id="task-method" maxlength="3000" required placeholder="对象、题量、方法和独立尝试…">${esc(t.steps[0].detail)}</textarea><label for="task-standard">验收与产出</label><textarea id="task-standard" maxlength="3000" required placeholder="留下什么？怎么确认是真的会做了？">${esc(t.steps[1].detail)}</textarea><p class="small muted" style="font-size:10px;margin-top:10px">${fixed?'课程与工作时段来自原表，本次只修改做法。':'修改仅影响这一天，其他周的课表不变。时间重叠时请合理调整。'}</p><div class="modal-actions">${!extra&&t.id.startsWith('custom-')?'<button type="button" class="danger" data-action="delete-task">删除</button>':''}<button type="button" class="btn outline" data-action="close-modal">取消</button><button type="submit" class="btn">保存调整</button></div></form>`);$('#task-form').addEventListener('submit',e=>{e.preventDefault();const ctx=editContext,proposed={...ctx.t,title:$('#task-title').value.trim(),start:fixed?ctx.t.start:$('#task-start').value,end:fixed?ctx.t.end:$('#task-end').value,steps:[{title:ctx.t.steps[0].title,detail:$('#task-method').value.trim()},{title:ctx.t.steps[1].title,detail:$('#task-standard').value.trim()}]};let changed;try{changed=cleanTask(proposed,ctx.t,ctx.extra||ctx.t.id.startsWith('custom-'))}catch(e){toast('请填写具体做法，结束时间须晚于开始时间。');return}const r=record(ctx.date);if(ctx.extra)r.extra.push(changed);else if(ctx.t.id.startsWith('custom-'))r.extra=r.extra.map(t=>t.id===ctx.t.id?changed:t);else r.overrides[ctx.t.id]=changed;changed.steps.forEach((_,i)=>delete r.checks[`${changed.id}:${i}`]);r.checked=false;save();closeModal();expanded.add(changed.id);render();toast('已保存当天安排，请重新验收这个任务。')})}
function deleteTask(){if(!editContext)return;const {date,t}=editContext,r=record(date);r.extra=r.extra.filter(x=>x.id!==t.id);t.steps.forEach((_,i)=>delete r.checks[`${t.id}:${i}`]);r.checked=false;save();closeModal();render();toast('已删除这个自定义任务，其他周不受影响。')}
function editTopic(course){if(!courseFor(course))return;showModal(`<div class="modal-head"><h2>${esc(course)} · 本周重点</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('close')}</button></div><form id="topic-form"><label for="topic-text">章节、薄弱点或本周小作品</label><textarea id="topic-text" maxlength="2000" required>${esc(topicFor(selected,course))}</textarea><p class="small muted" style="font-size:10px;margin-top:10px">只修改${chineseDate(monday(selected))}所在周，其他周独立保存。</p><div class="modal-actions"><button class="btn outline" type="button" data-action="close-modal">取消</button><button class="btn" type="submit">保存本周重点</button></div></form>`);$('#topic-form').addEventListener('submit',e=>{e.preventDefault();const text=$('#topic-text').value.trim();if(!text)return;weekRecord(selected).topics[course]=text;save();closeModal();render();toast('本周重点已保存。')})}
async function importFile(file){if(!file)return;if(file.size>5000000){toast('文件过大，请选择本站导出的JSON或TXT备份。');return}let incoming;try{incoming=validateBackup(JSON.parse(await file.text()))}catch(e){toast('无法导入：不是有效的课间学习备份。');return}showModal(`<div class="modal-head"><h2>恢复学习记录</h2><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('close')}</button></div><p class="small muted" style="font-size:13px">这份备份包含${Object.keys(incoming.days).length}天、${Object.keys(incoming.weeks).length}周的记录。导入会替换当前记录；确认后会先请求下载当前完整备份。</p><div class="modal-actions"><button class="btn outline" data-action="close-modal">取消</button><button id="confirm-import" class="btn">备份当前并恢复</button></div>`);$('#confirm-import').addEventListener('click',()=>{backup(true);state=incoming;save();closeModal();render();toast('记录已恢复，请保留刚才导出的旧备份。')},{once:true})}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;({view:()=>navigate(el.dataset.view),'select-date':()=>selectDate(el.dataset.date),'prev-day':()=>selectDate(add(selected,-1)),'next-day':()=>selectDate(add(selected,1)),today:()=>selectDate(today()),expand:()=>{expanded.has(el.dataset.id)?expanded.delete(el.dataset.id):expanded.add(el.dataset.id);render()},'toggle-task':()=>toggleTask(el.dataset.id),'toggle-step':()=>toggleStep(el.dataset.id,+el.dataset.index),checkin:confirmDay,'edit-task':()=>editTask(el.dataset.id),'add-task':()=>editTask('',true),'delete-task':deleteTask,'edit-topic':()=>editTopic(el.dataset.course),'close-modal':closeModal,'prev-week':()=>moveWeek(-1),'next-week':()=>moveWeek(1),'this-week':()=>{flush();selected=today();render()},'prev-month':()=>moveMonth(-1),'next-month':()=>moveMonth(1),'calendar-today':()=>{month=today().slice(0,7);render()},'review-toggle':()=>{const w=weekRecord(selected);w.reviews[el.dataset.index]=!w.reviews[el.dataset.index];save();render()},'download-center':downloadCenter,'download-zip':downloadZIP,'share-zip':shareZIP,'download-html':downloadHTML,'backup-text':backupText,'copy-backup':copyBackup,'share-backup':shareBackup,'paste-backup':pasteBackup,backup:()=>backup(),csv,import:()=>$('#import-file').click(),install:installApp}[el.dataset.action])?.()});
document.addEventListener('input',e=>{const el=e.target;if(el.id==='day-note'){record(selected).note=el.value;clearTimeout(noteTimer);noteTimer=setTimeout(save,250)}if(el.id==='week-note'){weekRecord(selected).note=el.value;clearTimeout(noteTimer);noteTimer=setTimeout(save,250)}if(el.id==='calendar-search'){search=el.value;$('#calendar-grid').innerHTML=calendarCells()}});

document.addEventListener('keydown',e=>{const modal=$('#modal-root .modal');if(!modal)return;if(e.key==='Escape')closeModal();if(e.key==='Tab'){const f=[...modal.querySelectorAll('button,input,textarea,select')].filter(x=>!x.disabled),first=f[0],last=f.at(-1);if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault()}}});
